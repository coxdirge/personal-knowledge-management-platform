services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ricardo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, copy .env.example to .env}
      POSTGRES_DB: pkm

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ricardo -d pkm"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ricardo
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, copy .env.example to .env}
      DB_NAME: pkm
      DB_SSLMODE: disable

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  postgres_data:
